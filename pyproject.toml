[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "empirical-risk-premia-engine"
version = "0.13.0"
description = "Multi-asset empirical pricing, premia identification, funded rates factors and portable research snapshots"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "statsmodels>=0.14", "requests>=2.28", "openpyxl>=3.1"]
[project.optional-dependencies]
notebook = ["matplotlib>=3.7", "ipykernel>=6", "nbformat>=5", "yfinance>=0.2", "jupyterlab>=4"]
test = ["pytest>=7", "nbformat>=5"]
report = ["matplotlib>=3.7", "lxml>=4.9", "nbformat>=5"]
[tool.setuptools.packages.find]
where = ["src"]
